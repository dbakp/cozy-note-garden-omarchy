[package]
name = "cozy-note-garden"
version = "1.0.0"
description = "A private, local-first notes garden for Omarchy"
authors = ["Cozy Note Garden contributors"]
edition = "2021"

[lib]
name = "cozy_note_garden_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
toml = "1.1"

